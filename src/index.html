<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="styles.css" rel="stylesheet">
        <link href="card.css" rel="stylesheet">

        <script src="card.js" defer></script>
        <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
 
        <title>Twenty Eight</title>
    </head>

    <body class="body-content">
        <div class="container" id="start">
            <h1>28</h1>
            <input type="text" placeholder="Name" id="name"/>
            <input type="text" placeholder="Room Code" id="code"/>
            <button id="join">Join Room</button>
            <button id="create">Create Room</button>
        </div>

        <h2 class="hidden" id="roomCode">Room Code: 6PYX1</h2>
        <div class="container hidden" id="lobby">
            <h1>28</h1>
            <ul id="playerList">
            </ul>
            <button id="startGame">Start Game</button>
            <button id="leave">Leave Game</button>
        </div>

        <div class="hidden table" id="playingTable">
            <div class="opponent-table" id="oppTable">

            </div>

            <div class="table-middle card-container" id="tableMiddle">

            </div>

            <div class="my-cards card-container" id="myCards">
                
            </div>

            <div class="alert" id="alerts">

            </div>

            <div class="trumpcard" id="trumpcard">

            </div>
        </div>
    </body>

    <script>
        // PeerJS is now available globally as Peer
        const Peer = window.Peer;

        var nameIn = document.querySelector("#name");
        var codeIn = document.querySelector("#code");
  
        var joinBtn = document.querySelector("#join");
        var createBtn = document.querySelector("#create");
        var leaveBtn = document.querySelector("#leave");
        var startBtn = document.querySelector("#startGame");

        var peer;
        var room;
        var playerID;
        var started = false;
        var connections = [];
        var players;
        var hand = [];
        var middleCards = [];
        var turn;
        var callPoints;
        var trumpcardRevealed;
        var curPoints;
        var curSuit;
        var trumpcard = "";
        var caller;
        var isHost = false;
        var gameData = {};

        const cardOrder = ["7", "8", "Q", "K", "10", "A", "9", "J"];

        function reset() {
            room = null;
            playerID = null;
            started = false;
            players = null;
            isHost = false;
            connections = [];

            document.getElementById("start").classList.remove("hidden");
            document.getElementById("roomCode").classList.add("hidden");
            document.getElementById("lobby").classList.add("hidden");

            var ul = document.getElementById("playerList");

            while(ul.firstChild) {
                ul.removeChild(ul.firstChild);
            }
            
            // Close all peer connections
            connections.forEach(conn => {
                if (conn.open) {
                    conn.close();
                }
            });
            connections = [];

            var myCards = document.getElementById("myCards");
            var middleTable = document.getElementById("tableMiddle");
            var oppTable = document.getElementById("oppTable");

            while(myCards.firstChild) {
                myCards.removeChild(myCards.firstChild);
            }

            while(middleTable.firstChild) {
                middleTable.removeChild(middleTable.firstChild);
            }

            while(oppTable.firstChild) {
                oppTable.removeChild(oppTable.firstChild);
            }
        }
        
        function addPlayers() {
            var ul = document.getElementById("playerList");

            while(ul.firstChild) {
                ul.removeChild(ul.firstChild);
            }
                        
            for (const name in players) {
                var li = document.createElement("li");
                li.appendChild(document.createTextNode(name));
                li.setAttribute("id", name);
                ul.appendChild(li);
                
                if (name == playerID) {
                    li.classList.add("me");
                }
            }
            
            // Hide start button for non-host players
            const startButton = document.getElementById("startGame");
            if (!isHost) {
                startButton.classList.add("hidden");
            } else {
                startButton.classList.remove("hidden");
            }
        }

        function updateGame(data) {
            if ("curCards" in data) {
                middleCards = data.curCards;
            } else {
                middleCards = [];
            }

            if (data.players[playerID] && data.players[playerID].cards) {
                hand = data.players[playerID].cards;
            } else {
                hand = [];
            }

            players = data.players;
            
            // Handle initial join - move to lobby if not already there
            if (!isHost && document.getElementById("start").classList.contains("hidden") === false) {
                document.getElementById("roomCode").innerHTML = `Room Code: ${room}`;
                document.getElementById("start").classList.add("hidden");
                document.getElementById("roomCode").classList.remove("hidden");
                document.getElementById("lobby").classList.remove("hidden");
            }
            
            addPlayers(); // Update the UI
            
            // Check if game just started - handle transition for all players
            if (data.started && !started) {
                // Transition to playing screen for all players
                document.getElementById("lobby").classList.add("hidden");
                document.getElementById("playingTable").classList.remove("hidden");
            }
            
            started = data.started;
            
            callPoints = data.callPoints;
            trumpcardRevealed = data.trumpcardRevealed;
            curPoints = data.curPoints;
            curSuit = data.curSuit;
            caller = data.caller;
            trumpcard = data.trumpcard;

            if (data.lastWinner) {
                if (document.getElementById("lastWinner")) { document.getElementById("lastWinner").remove(); }
                
                const alerts = document.querySelector("#alerts");
                const cont = document.createElement("div");
                cont.id = "lastWinner";
                cont.innerText = `${data.lastWinner} won last btw`;
                alerts.appendChild(cont);
            }

            drawAllCards();

            // Handle card dealing when game starts
            if (data.started && data.turn == playerID && (!data.players[playerID].cards || data.players[playerID].cards.length === 0) && data.cards && data.cards.length > 0) {
                var newHand = [];
                for (let i = 0; i < 4; i++) {
                    const idx = Math.floor(Math.random() * data.cards.length);
                    const card = data.cards[idx];

                    data.cards.splice(idx, 1);
                    newHand.push(card);
                }

                hand = [...newHand];
                data.players[playerID].cards = hand;

                var newTurn;
                var playerList = Object.keys(data.players);

                if (playerList.indexOf(data.turn) < playerList.length-1) {
                    newTurn = playerList[playerList.indexOf(data.turn) + 1];
                } else {
                    newTurn = playerList[0];
                }

                data.turn = newTurn;
                data.cards = data.cards;
                data.players = data.players;

                broadcastGameUpdate(data);
                drawAllCards();
            }

            else if (!data.callingOver && !data.secondDeal) {
                if (document.getElementById("bidInfo")) {
                    document.getElementById("bidInfo").remove();
                }
                    
                const alerts = document.querySelector("#alerts");
                const cont = document.createElement("div");
                cont.id = "bidInfo";
                cont.innerText = `Caller: ${data.caller} Bid: ${data.callPoints}`;
                alerts.appendChild(cont);

                if (data.turn == data.caller && data.turn == playerID) {
                    drawAllCards(submitTrumpCard);
                    console.log(data.callingOver);
                    
                    const trumpCont = document.createElement("div");
                    trumpCont.id = "selectTrump";
                    trumpCont.innerText = "Select a Trump Card";
                    alerts.appendChild(trumpCont);
                }

                else if (data.turn == playerID) {
                    const alerts = document.querySelector("#alerts");
                    const cont = document.createElement("div");
                    cont.id = "bidContainer";

                    const label = document.createElement("div");
                    label.innerHTML = "Bid: ";
                    cont.appendChild(label);

                    const numberInput = document.createElement("input");
                    numberInput.type = "number";
                    numberInput.min = "14";
                    numberInput.max = "28";
                    numberInput.id = "bid";
                    numberInput.placeholder = "Bid";
                    cont.appendChild(numberInput);

                    const enterBtn = document.createElement("button");
                    enterBtn.id = "enterBid";
                    enterBtn.textContent = "Submit Bid";
                    enterBtn.addEventListener("click", enterBid);
                    cont.appendChild(enterBtn);

                    const skipBtn = document.createElement("button");
                    skipBtn.id = "skipBid";
                    skipBtn.textContent = "Skip";
                    skipBtn.addEventListener("click", skipBid);
                    cont.appendChild(skipBtn);

                    alerts.appendChild(cont);
                }
            }
            
            else if (data.callingOver && !data.secondDeal && data.turn == playerID && Object.values(players).every(player => Array.isArray(player.cards) && player.cards.length === 0)) {
                // Game over, did caller win, distribute winnings, reset game for another one
                var callerWin = (data.curPoints >= data.callPoints);

                if (callerWin) {
                    players[data.caller].chips += Object.keys(players).length-1;
                    
                    for (let player in players) {
                        if (player == data.caller) { continue; }

                        players[player].chips--;
                    }
                } else {
                    players[data.caller].chips -= Object.keys(players).length-1;
                    
                    for (let player in players) {
                        if (player == data.caller) { continue; }

                        players[player].chips++;
                    }
                }

                const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
                let roomID = "";
                const charactersLength = characters.length;

                for (let i = 0; i < 5; i++) {
                    roomID += characters.charAt(Math.floor(Math.random() * charactersLength));
                }

                const suits = ["spade", "heart", "diamond", "club"];
                const ranks = ["A", "K", "Q", "J", "10", "9"];
                const cards = {};
                let index = 0;

                for (const suit of suits) {
                    for (const rank of ranks) {
                        cards[index] = `${rank} ${suit}`;
                        index++;
                    }
                }

                data.players = players;
                data.turn = playerID;
                data.trumpcard = "";
                data.callPoints = 0;
                data.curPoints = 0;
                data.callerPoints = 0;
                data.curSuit = "";
                data.caller = "";
                data.cards = cards;
                data.curWinner = "";
                data.trumpcardRevealed = false;
                data.started = false;
                data.callingOver = false;
                data.secondDeal = false;
                data.lastWinner = "";

                broadcastGameUpdate(data);
            }

            else if (data.callingOver && data.secondDeal && data.turn == playerID) {
                if (players[playerID].cards.length == 7 || players[playerID].cards.length == 8) {
                    data.secondDeal = false;
                    broadcastGameUpdate(data);
                } else {
                    for (let i = 0; i < 4; i++) {
                        const idx = Math.floor(Math.random() * data.cards.length);
                        const card = data.cards[idx];

                        data.cards.splice(idx, 1);
                        hand.push(card);
                    }

                    data.players[playerID].cards = hand;
                    var newTurn;
                    var playerList = Object.keys(data.players);

                    if (playerList.indexOf(data.turn) < playerList.length-1) {
                        newTurn = playerList[playerList.indexOf(data.turn) + 1];
                    } else {
                        newTurn = playerList[0];
                    }

                    data.cards = data.cards;
                    data.players = data.players;
                    data.turn = newTurn;

                    broadcastGameUpdate(data);
                }
            }
        
            else if (data.callingOver && !data.secondDeal && data.turn == playerID) {
                if (Object.keys(players).length == middleCards.length) {
                    // Figure out winner, add points, transition turn, alert players
                    setTimeout(() => {
                        if (data.curWinner == data.caller) {
                            data.callerPoints += data.curPoints;
                        }

                        data.turn = data.curWinner;
                        data.callerPoints = data.callerPoints;
                        data.curPoints = 0;
                        data.curCards = [];
                        data.curWinner = "";
                        data.curSuit = "";
                        data.lastWinner = data.curWinner;

                        broadcastGameUpdate(data);
                    }, 3000);
                }

                else if (curSuit && !trumpcardRevealed && !hand.some(str => str.includes(curSuit))) {
                    const alerts = document.querySelector("#alerts");
                    const cont = document.createElement("div");

                    const revealBtn = document.createElement("button");
                    revealBtn.id = "reveal";
                    revealBtn.textContent = "Reveal Trump Card";
                    revealBtn.addEventListener("click", showTrumpCard);

                    cont.appendChild(revealBtn);
                    alerts.appendChild(cont);
                }

                else if (trumpcardRevealed) {
                    const alerts = document.querySelector("#alerts");
                    const cont = document.createElement("div");
                    cont.id = "turnInfo";
                    cont.innerText = "YOUR TURN";
                    alerts.appendChild(cont);

                    drawAllCards(playCardTrump);
                }

                else {
                    const alerts = document.querySelector("#alerts");
                    const cont = document.createElement("div");
                    cont.id = "turnInfo";
                    cont.innerText = "YOUR TURN";
                    alerts.appendChild(cont);

                    drawAllCards(playCardNoTrump);
                }
            }
        }

        function startUpdate(s) {
            started = s;

            if (started == true) {
                document.getElementById("lobby").classList.add("hidden");
                document.getElementById("playingTable").classList.remove("hidden");
                
                if (!(gameData.turn == playerID)) {
                    startUpdate(s);
                    return;
                }

                var newHand = [];
                for (let i = 0; i < 4; i++) {
                    const idx = Math.floor(Math.random() * gameData.cards.length);
                    const card = gameData.cards[idx];

                    gameData.cards.splice(idx, 1);
                    newHand.push(card);
                }

                hand = [...newHand];
                gameData.players[playerID].cards = hand;

                var newTurn;
                var playerList = Object.keys(gameData.players);

                if (playerList.indexOf(gameData.turn) < playerList.length-1) {
                    newTurn = playerList[playerList.indexOf(gameData.turn) + 1];
                } else {
                    newTurn = playerList[0];
                }

                gameData.turn = newTurn;
                gameData.cards = gameData.cards;
                gameData.players = gameData.players;

                broadcastGameUpdate(gameData);
                drawAllCards();
            } else {
                document.getElementById("lobby").classList.remove("hidden");
                document.getElementById("playingTable").classList.add("hidden");
            }
        }

        function broadcastGameUpdate(data) {
            gameData = data;
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send({
                        type: 'gameUpdate',
                        data: data
                    });
                }
            });
        }

        function createRoom() {
            const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let roomID = "";
            const charactersLength = characters.length;

            for (let i = 0; i < 5; i++) {
                roomID += characters.charAt(Math.floor(Math.random() * charactersLength));
            }

            const suits = ["spade", "heart", "diamond", "club"];
            const ranks = ["A", "K", "Q", "J", "10", "9"];
            const cards = []; // Change from {} to []
            let index = 0;

            for (const suit of suits) {
                for (const rank of ranks) {
                    cards.push(`${rank} ${suit}`); // Use push instead of assignment
                }
            }

            playerID = nameIn.value;
            isHost = true;

            // Create peer with room ID
            peer = new Peer(roomID);

            peer.on('open', (id) => {
                console.log('My peer ID is: ' + id);
                
                gameData = {
                    players: {
                        [playerID]: {
                            chips: 0,
                            cards: [], // Initialize empty cards array
                            peerId: id // Store host's peer ID
                        }
                    },
                    turn: playerID,
                    trumpcard: "",
                    callPoints: 0,
                    curPoints: 0,
                    callerPoints: 0,
                    curSuit: "",
                    caller: "",
                    cards: cards, // Now cards is an array
                    curWinner: "",
                    trumpcardRevealed: false,
                    started: false,
                    callingOver: false,
                    lastWinner: "",
                };

                room = roomID;
                players = gameData.players;

                document.getElementById("roomCode").innerHTML = `Room Code: ${room}`;
                document.getElementById("start").classList.add("hidden");
                document.getElementById("roomCode").classList.remove("hidden");
                document.getElementById("lobby").classList.remove("hidden");

                var ul = document.getElementById("playerList");
                var li = document.createElement("li");
                li.appendChild(document.createTextNode(playerID));
                li.setAttribute("id", playerID);
                ul.appendChild(li);
                li.classList.add("me");
            });

            peer.on('connection', (conn) => {
                console.log('New connection from: ' + conn.peer);
                connections.push(conn);
                
                conn.on('open', () => {
                    // Send current game state to new player
                    conn.send({
                        type: 'gameUpdate',
                        data: gameData
                    });
                });

                conn.on('data', (data) => {
                    handlePeerData(data, conn);
                });

                conn.on('close', () => {
                    console.log('Connection closed: ' + conn.peer);
                    connections = connections.filter(c => c !== conn);
                    // Handle player disconnection
                    handlePlayerDisconnection(conn.peer);
                });
            });
        }

        function joinRoom() {
            if (codeIn.value == "") {
                alert("Please enter a code");
                return;
            }

            playerID = nameIn.value;
            room = codeIn.value;

            // Create peer to connect to host
            peer = new Peer();

            peer.on('open', (id) => {
                console.log('My peer ID is: ' + id);
                
                // Connect to host
                const conn = peer.connect(room);
                
                conn.on('open', () => {
                    console.log('Connected to host');
                    connections.push(conn);
                    
                    // Send join request with peer ID
                    conn.send({
                        type: 'joinRequest',
                        playerID: playerID,
                        peerId: id // Include peer ID in join request
                    });
                });

                conn.on('data', (data) => {
                    handlePeerData(data, conn);
                });

                conn.on('close', () => {
                    console.log('Connection to host closed');
                    alert('Host disconnected');
                    reset();
                });
            });
        }

        function handlePeerData(data, conn) {
            if (data.type === 'gameUpdate') {
                updateGame(data.data);
            } else if (data.type === 'joinRequest') {
                // Host handling new player join
                if (gameData.players[data.playerID]) {
                    conn.send({
                        type: 'joinRejected',
                        reason: 'Name already taken'
                    });
                    return;
                }

                // Store the peer ID with the player data
                gameData.players[data.playerID] = {
                    chips: 0,
                    cards: [], // Initialize empty cards array
                    peerId: data.peerId || conn.peer // Use provided peer ID or connection peer ID
                };
                players = gameData.players;
                addPlayers(); // Update UI for new player

                // Broadcast updated player list
                broadcastGameUpdate(gameData);
            } else if (data.type === 'joinRejected') {
                alert(data.reason);
                reset();
            }
        }

        function handlePlayerDisconnection(peerId) {
            // Find player by peer ID and remove them
            const disconnectedPlayer = Object.keys(players).find(player => 
                players[player].peerId === peerId
            );
            
            if (disconnectedPlayer) {
                delete players[disconnectedPlayer];
                gameData.players = players;
                
                // Notify all remaining players about the disconnection
                const alerts = document.querySelector("#alerts");
                const cont = document.createElement("div");
                cont.id = "playerLeft";
                cont.innerText = `${disconnectedPlayer} left the game`;
                alerts.appendChild(cont);
                
                // Remove the notification after 3 seconds
                setTimeout(() => {
                    if (document.getElementById("playerLeft")) {
                        document.getElementById("playerLeft").remove();
                    }
                }, 3000);
                
                // Update the player list in the UI
                addPlayers();
                
                broadcastGameUpdate(gameData);
            }
        }

        function leaveRoom() {
            if (isHost) {
                // Host leaving - close all connections
                connections.forEach(conn => {
                    conn.close();
                });
            } else {
                // Client leaving - close connection to host
                connections.forEach(conn => {
                    conn.close();
                });
            }

            if (peer) {
                peer.destroy();
            }

            reset();
        }

        function startGame() {
            started = true;
            console.log(room)

            gameData.started = true;
            
            // Initialize empty cards array for all players
            for (let player in gameData.players) {
                if (!gameData.players[player].cards) {
                    gameData.players[player].cards = [];
                }
            }
            
            // Deal cards to the first player (host)
            if (gameData.turn == playerID) {
                var newHand = [];
                for (let i = 0; i < 4; i++) {
                    const idx = Math.floor(Math.random() * gameData.cards.length);
                    const card = gameData.cards[idx];

                    gameData.cards.splice(idx, 1);
                    newHand.push(card);
                }

                hand = [...newHand];
                gameData.players[playerID].cards = hand;

                var newTurn;
                var playerList = Object.keys(gameData.players);

                if (playerList.indexOf(gameData.turn) < playerList.length-1) {
                    newTurn = playerList[playerList.indexOf(gameData.turn) + 1];
                } else {
                    newTurn = playerList[0];
                }

                gameData.turn = newTurn;
                gameData.cards = gameData.cards;
                gameData.players = gameData.players;
            }
            
            // Transition to playing screen for all players
            document.getElementById("lobby").classList.add("hidden");
            document.getElementById("playingTable").classList.remove("hidden");
            
            broadcastGameUpdate(gameData);
        }

        function drawAllCards(onMove=null) {
            var myCards = document.getElementById("myCards");
            var middleTable = document.getElementById("tableMiddle");
            var oppTable = document.getElementById("oppTable");

            while(myCards.firstChild) {
                myCards.removeChild(myCards.firstChild);
            }

            while(middleTable.firstChild) {
                middleTable.removeChild(middleTable.firstChild);
            }

            while(oppTable.firstChild) {
                oppTable.removeChild(oppTable.firstChild);
            }

            var selfNameTag = document.createElement("h3");
            selfNameTag.innerHTML = `Me\n${players[playerID].chips}`;
            selfNameTag.classList.add("name-tag");
            myCards.appendChild(selfNameTag);

            for (var i = 0; i < hand.length; i++) {
                let card = hand[i];
                let [value, suit] = card.split(" ");
                let cardDiv = document.createElement("div");

                cardDiv.setAttribute("data-suit", suit);
                cardDiv.setAttribute("data-value", value);
                cardDiv.id = card;
                cardDiv.classList.add("card");
                if (onMove != null) {
                    cardDiv.onclick = () => onMove(card);
                }

                myCards.appendChild(cardDiv);
            }

            for (var i = 0; i < middleCards.length; i++) {
                var card = middleCards[i];
                var [value, suit] = card.split(" ");
                var cardDiv = document.createElement("div");

                cardDiv.setAttribute("data-suit", suit);
                cardDiv.setAttribute("data-value", value);
                cardDiv.classList.add("card")

                middleTable.appendChild(cardDiv);
            }

            for (const name in players) {
                if (!("cards" in players[name]) || name == playerID) {
                    continue;
                }

                var cardsDiv = document.createElement("div");
                cardsDiv.classList.add("card-container");
                cardsDiv.setAttribute("id", name);

                var nameTag = document.createElement("h3");
                nameTag.classList.add("name-tag");
                nameTag.innerHTML = `${name} ${players[name].chips}`;

                cardsDiv.appendChild(nameTag);

                for (var i = 0; i < players[name].cards.length; i++) {
                    var card = players[name].cards[i];
                    var cardDiv = document.createElement("div");

                    cardDiv.setAttribute("data-value", "back");
                    cardDiv.classList.add("card")

                    cardsDiv.appendChild(cardDiv);
                }

                oppTable.appendChild(cardsDiv);
            }

            if (trumpcardRevealed) {
                const trumpDiv = document.getElementById("trumpcard");

                while (trumpDiv.firstChild) {
                    trumpDiv.removeChild(trumpDiv.firstChild);
                }

                let [value, suit] = trumpcard.split(" ");
                let cardDiv = document.createElement("div");

                const label = document.createElement("h3");
                label.textContent = "Trump Card";
                label.id = "trumpLabel";

                cardDiv.setAttribute("data-suit", suit);
                cardDiv.setAttribute("data-value", value);
                cardDiv.id = trumpcard;
                cardDiv.classList.add("card");

                trumpDiv.append(label);
                trumpDiv.append(cardDiv);
            }
        }

        function enterBid() {
            var value = parseInt(document.getElementById("bid").value);

            if (value < 14) {
                value = 14;
            } else if (value > 28) {
                value = 28;
            }

            if (value <= callPoints) {
                return;
            }

            var newTurn;
            var playerList = Object.keys(players);

            if (playerList.indexOf(playerID) < playerList.length-1) {
                newTurn = playerList[playerList.indexOf(playerID) + 1];
            } else {
                newTurn = playerList[0];
            }

            gameData.callPoints = value;
            gameData.caller = playerID;
            gameData.turn = newTurn;

            broadcastGameUpdate(gameData);
            document.getElementById("bidContainer").remove();
        }
